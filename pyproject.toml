[project]
name = "multicam-occlusion"
version = "0.1.0"
description = "A multi-camera synthetic occlusion benchmark: single-view vs multi-view 3D recovery under occlusion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bamdad Dashtban" }]
keywords = ["multi-view-geometry", "triangulation", "occlusion", "benchmark", "computer-vision"]
dependencies = ["numpy>=1.26", "pydantic>=2.7"]

[project.urls]
Homepage = "https://github.com/bamdadd/multicam-occlusion"
Repository = "https://github.com/bamdadd/multicam-occlusion"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multicam_occlusion"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
# Optional: only needed to regenerate the docs figure. Synced by the sweep-figure CI job, not by the numpy-only check gate.
docs = ["matplotlib>=3.8"]
# Optional: only needed to *generate* the occlusion sweep (drives multicam-sim's
# analytic manifest producer). The committed fixture + core pipeline stay
# numpy-only, so CI never installs this. Regenerate the sweep with `make sweep`.
bench = [
    "matplotlib>=3.8",
    "multicam-sim @ git+https://github.com/bamdadd/multicam-sim@main",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# 3.12 so mypy can parse NumPy's PEP 695 `type` aliases in its bundled stubs;
# the package itself runs on 3.11+ (see requires-python).
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
